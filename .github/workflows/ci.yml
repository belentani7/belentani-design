name: CI

on:
  push:
    branches: [duck]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate, tests y HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Gate del sistema, tokens al dia y tests
        run: npm run verify

      - name: Validacion HTML (W3C via html-validate)
        run: npx html-validate index.html tokens.html 404.html

      - name: Metricas
        run: |
          {
            echo '## Metricas del sistema'
            echo
            node scripts/audit.mjs --markdown
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: Lighthouse (Chrome real)
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Servir el sitio con el servidor del repo
        run: |
          nohup node scripts/serve.mjs --port 8080 --quiet > /tmp/serve.log 2>&1 &
          for intento in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              echo "servidor listo en el intento $intento"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::El servidor no responde"; cat /tmp/serve.log; exit 1

      - name: Lighthouse contra la portada y la pagina de tokens
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:8080/
            http://127.0.0.1:8080/tokens.html
          configPath: ./.lighthouserc.json
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse

      - name: Puntuaciones medidas
        if: always()
        env:
          RESULTADOS: ${{ steps.lighthouse.outputs.resultsPath }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dir="${RESULTADOS:-.lighthouseci}"
          echo '## Lighthouse' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          node scripts/lighthouse-summary.mjs --dir "$dir" --markdown >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            node scripts/lighthouse-summary.mjs --dir "$dir" --markdown > /tmp/lighthouse.md
            gh pr comment "$PR" --body-file /tmp/lighthouse.md
          fi
